services:
  mongodb:
    image: mongo:7.0
    container_name: insider_threat_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=insider_threat_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - insider_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insider_threat_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - FLASK_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/insider_threat_db
      - MONGODB_DB_NAME=insider_threat_db
      - USE_MOCK_DB=false
      - SECRET_KEY=insider-threat-capstone-secret-key-2026
      - CONTAMINATION_RATE=0.1
      - RISK_THRESHOLD_HIGH=60.0
      - RISK_THRESHOLD_CRITICAL=85.0
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - insider_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/v1/system/status"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insider_threat_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - insider_net

networks:
  insider_net:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
